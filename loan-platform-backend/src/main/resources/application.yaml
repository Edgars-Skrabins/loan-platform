spring:
  application:
    name: loan-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/loan_platform
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: "your-super-secret-key-change-this-in-production-at-least-32-characters-long-12345678"

logging:
  level:
    root: INFO
    io.github.edgarsskrabins: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


