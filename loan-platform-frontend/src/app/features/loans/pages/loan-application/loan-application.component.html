<div class="application-container">
  <div class="header">
    <button mat-icon-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="page-title">Apply for a Loan</h1>
  </div>

  <mat-card class="application-card">
    <mat-card-header>
      <p class="subtitle">Fill in the details below to start your loan application</p>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="applicationForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Loan Amount</mat-label>
          <mat-icon matPrefix>attach_money</mat-icon>
          <input
            matInput
            type="number"
            step="100"
            formControlName="amount"
            placeholder="Enter amount in dollars"
            [disabled]="loading"
          />
          <mat-error *ngIf="f['amount'].hasError('required')">
            Amount is required
          </mat-error>
          <mat-error *ngIf="f['amount'].hasError('min')">
            Amount must be at least $100
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Loan Term</mat-label>
          <mat-icon matPrefix>schedule</mat-icon>
          <input
            matInput
            type="number"
            step="1"
            formControlName="termMonths"
            placeholder="Enter term in months"
            [disabled]="loading"
          />
          <mat-hint>Maximum 480 months (40 years)</mat-hint>
          <mat-error *ngIf="f['termMonths'].hasError('required')">
            Loan term is required
          </mat-error>
          <mat-error *ngIf="f['termMonths'].hasError('min')">
            Term must be at least 1 month
          </mat-error>
          <mat-error *ngIf="f['termMonths'].hasError('max')">
            Term cannot exceed 480 months
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button
            type="submit"
            mat-raised-button
            color="primary"
            [disabled]="loading || applicationForm.invalid"
          >
            <span *ngIf="!loading">Submit Application</span>
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          </button>
          <button
            type="button"
            mat-button
            (click)="cancel()"
            [disabled]="loading"
          >
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
