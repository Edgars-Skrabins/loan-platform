<div class="loan-list-container">
  <div class="header">
    <button mat-icon-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>My Loan Applications</h2>
    <button mat-raised-button color="primary" (click)="applyForLoan()">
      <mat-icon>add</mat-icon>
      Apply for Loan
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!loading && loans.length === 0" class="empty-state">
    <mat-card>
      <mat-card-content>
        <p>No loan applications yet</p>
        <button mat-raised-button color="primary" (click)="applyForLoan()">
          Start Your First Application
        </button>
      </mat-card-content>
    </mat-card>
  </div>

  <div *ngIf="!loading && loans.length > 0" class="loans-grid">
    <mat-card *ngFor="let loan of loans" class="loan-card">
      <mat-card-header>
        <div class="loan-header">
          <h3>Loan #{{ loan.id }}</h3>
          <mat-chip [color]="getStatusColor(loan.status)" selected>
            {{ loan.status | loanStatus }}
          </mat-chip>
        </div>
      </mat-card-header>

      <mat-card-content>
        <div class="loan-details">
          <div class="detail-row">
            <span class="label">Amount:</span>
            <span class="value">${{ loan.amount | number: '1.2-2' }}</span>
          </div>
          <div class="detail-row">
            <span class="label">Term:</span>
            <span class="value">{{ loan.termMonths }} months</span>
          </div>
          <div class="detail-row" *ngIf="loan.interestRate">
            <span class="label">Interest Rate:</span>
            <span class="value">{{ loan.interestRate }}%</span>
          </div>
          <div class="detail-row">
            <span class="label">Applied:</span>
            <span class="value">{{ loan.createdAt | date: 'short' }}</span>
          </div>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button (click)="viewLoan(loan.id)">View Details</button>
        <button mat-button color="warn" (click)="deleteLoan(loan.id)" *ngIf="canDelete(loan)">
          Delete
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
