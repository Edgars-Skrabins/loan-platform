<div class="dashboard-container">
  <mat-toolbar color="primary" class="dashboard-toolbar">
    <span class="toolbar-title">Loan Platform</span>
    <span class="spacer"></span>
    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/loans" routerLinkActive="active">Loans</a>
    </nav>
    <span class="spacer"></span>
    <div class="user-info">
      <span *ngIf="currentUser" class="user-email">{{ currentUser.email }}</span>
      <button mat-raised-button (click)="logout()" class="logout-btn">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </mat-toolbar>

  <div class="dashboard-content">
    <mat-card class="welcome-card">
      <mat-card-header>
        <h2>Welcome Back</h2>
      </mat-card-header>
      <mat-card-content>
        <p *ngIf="currentUser">
          You're logged in as <strong>{{ currentUser.email }}</strong>
        </p>
        <p *ngIf="currentUser">
          <strong>Role:</strong> {{ currentUser.role }}
        </p>
        <p>
          Use the navigation menu above to view your loans or apply for a new one.
        </p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" routerLink="/loans">
          <mat-icon>account_balance</mat-icon>
          View My Loans
        </button>
        <button mat-raised-button color="accent" routerLink="/loans/apply">
          <mat-icon>add</mat-icon>
          Apply for Loan
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
