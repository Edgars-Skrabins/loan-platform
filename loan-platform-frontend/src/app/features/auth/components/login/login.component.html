<!-- Login Component Template -->

<div class="login-container">
  <div class="login-card">
    <mat-card>
      <mat-card-header>
        <h2 class="login-title">Loan Platform</h2>
        <h3 class="login-subtitle">Sign in to your account</h3>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Email Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              [disabled]="loading"
            />
            <mat-error *ngIf="f['email'].hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="f['email'].hasError('email')">
              Please enter a valid email
            </mat-error>
          </mat-form-field>

          <!-- Password Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="Enter your password"
              [disabled]="loading"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              (click)="togglePasswordVisibility()"
              [disabled]="loading"
            >
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="f['password'].hasError('required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="f['password'].hasError('minlength')">
              Password must be at least 8 characters
            </mat-error>
          </mat-form-field>

          <!-- Submit Button -->
          <button
            type="submit"
            mat-raised-button
            color="primary"
            class="full-width submit-button"
            [disabled]="loading || loginForm.invalid"
          >
            <span *ngIf="!loading">Sign In</span>
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          </button>
        </form>
      </mat-card-content>

      <mat-card-footer>
        <p class="register-link">
          Don't have an account?
          <a (click)="goToRegister()" class="link">Sign up</a>
        </p>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
